*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter Tight',sans-serif;background:#0A1124;color:#fff;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
a{color:var(--purple-light);text-decoration:none}a:hover{color:#fff}
header{position:relative;z-index:1;display:flex;justify-content:center;padding:40px 24px 0}
.wm{font-weight:800;letter-spacing:-0.02em;line-height:1;font-size:24px}

main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:14px;letter-spacing:0.18em;text-transform:uppercase;color:#fff;border:1px solid rgba(197,140,255,0.45);border-radius:999px;padding:10px 20px;margin-bottom:32px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--purple-light);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(197,140,255,0.6)}50%{opacity:.45;box-shadow:0 0 0 6px rgba(197,140,255,0)}}
@media (prefers-reduced-motion:reduce){.eyebrow::before{animation:none}}
h1{font-weight:600;font-size:clamp(36px,5.5vw,60px);letter-spacing:-0.025em;line-height:1.05;margin-bottom:28px;text-wrap:balance}
p.sub{font-size:clamp(17px,2vw,19px);line-height:1.55;color:rgba(255,255,255,0.72);max-width:520px;margin-bottom:44px;text-wrap:pretty}
.contact{font-size:clamp(17px,2vw,19px);color:rgba(255,255,255,0.72)}
.contact a{font-weight:600;border-bottom:1px solid rgba(197,140,255,0.5);padding-bottom:2px}.contact a:hover{border-color:#fff}
.contact a:focus-visible{outline:2px solid var(--purple-light);outline-offset:4px}
footer{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:center;padding:0 24px 32px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;color:rgba(255,255,255,0.5)}
